spring.application.name=api-classroom
server.port=8080

# URL publica de la app. En local es esta.
app.base-url=http://localhost:8080
server.forward-headers-strategy=framework

# Carpeta donde se guardan los tokens de todos los usuarios (uno por correo)
app.tokens-dir=tokens

# Zona horaria
app.timezone=America/Bogota

# Sincronizacion automatica (formato ISO-8601)
app.sync.interval=PT30M
app.sync.initial-delay=PT1M

# Recordatorios (minutos antes de la entrega)
app.reminder.email-minutes=1440
app.reminder.popup-minutes=120

# Fuente simulada de ejemplo (true para activarla)
app.fuente-simulada.activa=false